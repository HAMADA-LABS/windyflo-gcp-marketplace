{{- if .Values.externalSecrets.enabled }}
{{- /*
  When externalSecrets.enabled=true, templates/secret.yaml does NOT render the plaintext Secret.
  This ExternalSecret is what replaces it: ESO logs into the backend (Vault) via the referenced
  (Cluster)SecretStore and SYNCS the app Secret that main/worker mount (envFrom secretRef). Without
  this resource the pods would have no Secret to read → boot failure. Pairs with the
  ClusterSecretStore in the cluster-config chart (externalSecrets.io/v1).

  Two ways to map keys (use either or both):
    - externalSecrets.dataFromKey: pull EVERY key under one backend path (Vault KV: secret/<key>).
    - externalSecrets.remoteRefs:  explicit map of k8sSecretKey -> { key, property } for fine control.
  At least one must be set, else the synced Secret is empty and pods fail the same way.
*/ -}}
{{- if and (not .Values.externalSecrets.dataFromKey) (not .Values.externalSecrets.remoteRefs) }}
{{- fail "externalSecrets.enabled=true but neither externalSecrets.dataFromKey nor externalSecrets.remoteRefs is set — the synced Secret would be empty. Set one." }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "windyflo.fullname" . }}
  labels:
    {{- include "windyflo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    # MUST equal the Secret name the Deployments mount (windyflo.secretName) — that's the whole point.
    name: {{ include "windyflo.secretName" . }}
    creationPolicy: Owner
  {{- if .Values.externalSecrets.dataFromKey }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.dataFromKey | quote }}
  {{- end }}
  {{- with .Values.externalSecrets.remoteRefs }}
  data:
    {{- range $k8sKey, $ref := . }}
    - secretKey: {{ $k8sKey }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
