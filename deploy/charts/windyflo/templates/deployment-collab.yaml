{{- if .Values.collab.enabled }}
{{- /* INTERIM single-replica Yjs/y-websocket collab pod (p1 §A6.7, §42). Same image + command as
       main, but HARD-pinned to one replica because Yjs doc state is held in a per-process Map with
       no shared backend. The ingress routes WebSocket-upgrade traffic to the matching Service so
       every client on a given doc converges on this one pod. Known SPOF, accepted for Phase 1;
       real fix (shared Yjs backend) is the named follow-on spike. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "windyflo.fullname" . }}-collab
  labels:
    {{- include "windyflo.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
spec:
  replicas: {{ .Values.collab.replicaCount }}
  strategy:
    # Single replica with shared in-memory Yjs state: never run two pods at once (a rolling
    # surge would briefly split-brain the doc). Recreate ensures the old pod stops first.
    type: Recreate
  selector:
    matchLabels:
      {{- include "windyflo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collab
  template:
    metadata:
      labels:
        {{- include "windyflo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collab
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "windyflo.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collab
          image: {{ include "windyflo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toYaml .Values.collab.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.collab.port }}
          envFrom:
            - configMapRef:
                name: {{ include "windyflo.configName" . }}
            - secretRef:
                name: {{ include "windyflo.secretName" . }}
          env:
            {{- if and .Values.data.redis.embedded .Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windyflo-redis-auth
                  key: redis-password
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.collab.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.collab.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.collab.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.collab.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collab.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collab.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
