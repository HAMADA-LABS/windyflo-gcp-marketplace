{{- if not .Values.externalSecrets.enabled }}
{{- /*
  App Secret. Two ways to populate it:

  1. Explicit (default, prod/local): you supply secrets.* — render fails fast if a required one is
     missing, so you can't accidentally boot with a blank master key.

  2. Auto-generate (secrets.autoGenerate=true — Azure Marketplace / turnkey deploys): any required
     secret you DON'T supply is generated as a strong random value. On `helm upgrade` we `lookup` the
     already-deployed Secret and REUSE its values, so the master key (and every other secret) stays
     STABLE across upgrades. This matters: WINDYFLO_SECRETKEY_OVERWRITE is the AES key for all stored
     credentials — regenerating it would orphan every encrypted credential in the DB. The lookup
     keeps it fixed for the life of the release.
*/ -}}
{{- $sec := (lookup "v1" "Secret" .Release.Namespace (include "windyflo.secretName" .)) }}
{{- $existing := dict }}
{{- if $sec }}{{- $existing = $sec.data }}{{- end }}
{{- /* resolveSecret helper lives in _helpers.tpl: supplied → existing(b64dec) → generated → fail */ -}}
{{- $auto := .Values.secrets.autoGenerate }}
{{- $masterKey := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.WINDYFLO_SECRETKEY_OVERWRITE "existing" (get $existing "WINDYFLO_SECRETKEY_OVERWRITE") "gen" (randAlphaNum 32) "auto" $auto "required" true "name" "WINDYFLO_SECRETKEY_OVERWRITE") }}
{{- /* DATABASE_PASSWORD is single-sourced through windyflo.dbPassword so the CNPG owner-auth Secret
       (data/cnpg-cluster.yaml) renders the SAME value — see that helper for why this is not resolveSecret. */ -}}
{{- $dbPass := include "windyflo.dbPassword" . }}
{{- $s3Id := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.S3_STORAGE_ACCESS_KEY_ID "existing" (get $existing "S3_STORAGE_ACCESS_KEY_ID") "gen" (ternary (include "windyflo.minioRootUser" .) "windyflo-app" (.Values.data.plain | default false)) "auto" $auto "required" false "name" "S3_STORAGE_ACCESS_KEY_ID") }}
{{- /* S3 secret is DETERMINISTIC (release-derived), not randAlphaNum, for the same reason
       windyflo.minioRootCreds is: it has TWO consumers in one render — this Secret, which the app
       reads, and the minio-bootstrap Job, which runs `mc admin user add` with it. Helm evaluates
       randAlphaNum once per call site, so a random value here is fine while both read the same
       Secret key (they do), but a deterministic value is safe even if a future template renders the
       credential independently. `existing` still wins, so a rotated or user-supplied key persists
       across upgrades and this default is only ever used on a fresh install. */ -}}
{{- $s3Key := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.S3_STORAGE_SECRET_ACCESS_KEY "existing" (get $existing "S3_STORAGE_SECRET_ACCESS_KEY") "gen" (ternary (include "windyflo.minioRootPassword" .) (printf "%s-s3-app" .Release.Name | sha256sum | trunc 40) (.Values.data.plain | default false)) "auto" $auto "required" false "name" "S3_STORAGE_SECRET_ACCESS_KEY") }}
{{- $jwtAuth := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.JWT_AUTH_TOKEN_SECRET "existing" (get $existing "JWT_AUTH_TOKEN_SECRET") "gen" (randAlphaNum 32) "auto" $auto "required" false "name" "JWT_AUTH_TOKEN_SECRET") }}
{{- $jwtRefresh := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.JWT_REFRESH_TOKEN_SECRET "existing" (get $existing "JWT_REFRESH_TOKEN_SECRET") "gen" (randAlphaNum 32) "auto" $auto "required" false "name" "JWT_REFRESH_TOKEN_SECRET") }}
{{- $session := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.EXPRESS_SESSION_SECRET "existing" (get $existing "EXPRESS_SESSION_SECRET") "gen" (randAlphaNum 32) "auto" $auto "required" false "name" "EXPRESS_SESSION_SECRET") }}
{{- $tokenHash := include "windyflo.resolveSecret" (dict "supplied" .Values.secrets.TOKEN_HASH_SECRET "existing" (get $existing "TOKEN_HASH_SECRET") "gen" (randAlphaNum 32) "auto" $auto "required" false "name" "TOKEN_HASH_SECRET") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "windyflo.secretName" . }}
  labels:
    {{- include "windyflo.labels" . | nindent 4 }}
  annotations:
    # helm.sh/resource-policy keep: never delete the Secret on `helm uninstall`, in every mode — not
    # just autoGenerate. WINDYFLO_SECRETKEY_OVERWRITE is the AES key for every stored credential
    # regardless of whether it was supplied explicitly or auto-generated; losing it on a reinstall
    # orphans encrypted data left in PVCs either way.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  WINDYFLO_SECRETKEY_OVERWRITE: {{ $masterKey | quote }}
  DATABASE_PASSWORD: {{ $dbPass | quote }}
  S3_STORAGE_ACCESS_KEY_ID: {{ $s3Id | quote }}
  S3_STORAGE_SECRET_ACCESS_KEY: {{ $s3Key | quote }}
  {{- with $jwtAuth }}
  JWT_AUTH_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $jwtRefresh }}
  JWT_REFRESH_TOKEN_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $session }}
  EXPRESS_SESSION_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $tokenHash }}
  TOKEN_HASH_SECRET: {{ . | quote }}
  {{- end }}
  {{- /*
    extra: MinIO root creds + the Redis password also auto-generate under autoGenerate when
    distributed MinIO is on and they weren't supplied (the values-level lint guard is relaxed for
    the marketplace profile). $autoGenerated tracks which keys were just emitted explicitly above,
    so the range below never re-emits them — Helm doesn't error on duplicate stringData keys, it
    silently keeps the LAST one, which would clobber the value we just picked (see resolveSecret).
  */ -}}
  {{- $extra := .Values.secrets.extra | default dict }}
  {{- $autoGenerated := dict }}
  {{- if and .Values.secrets.autoGenerate (eq (.Values.data.minio.mode | default "") "distributed") }}
  {{- $minioCreds := include "windyflo.minioRootCreds" . | splitList "|" }}
  {{- if not (get $extra "MINIO_ROOT_USER") }}
  MINIO_ROOT_USER: {{ first $minioCreds | quote }}
  {{- $_ := set $autoGenerated "MINIO_ROOT_USER" true }}
  {{- end }}
  {{- if not (get $extra "MINIO_ROOT_PASSWORD") }}
  MINIO_ROOT_PASSWORD: {{ last $minioCreds | quote }}
  {{- $_ := set $autoGenerated "MINIO_ROOT_PASSWORD" true }}
  {{- end }}
  {{- if not (get $extra "REDIS_PASSWORD") }}
  REDIS_PASSWORD: {{ include "windyflo.redisPassword" . | quote }}
  {{- $_ := set $autoGenerated "REDIS_PASSWORD" true }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := $extra }}
  {{- if not (hasKey $autoGenerated $k) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
