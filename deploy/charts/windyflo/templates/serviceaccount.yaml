{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "windyflo.serviceAccountName" . }}
  labels:
    {{- include "windyflo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.data.redis.embedded .Values.redis.auth.enabled }}
---
{{- /* Redis password secret consumed by the bitnami subchart (auth.existingSecret). */}}
apiVersion: v1
kind: Secret
metadata:
  name: windyflo-redis-auth
  labels:
    {{- include "windyflo.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ include "windyflo.redisPassword" . | quote }}
{{- end }}
